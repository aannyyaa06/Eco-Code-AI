name: Sustainability CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install radon pylint codecarbon streamlit plotly pandas GitPython psutil reportlab PyYAML

      - name: Syntax check
        run: |
          python -m py_compile app.py sandbox.py refactor_engine.py energy_runner.py ecocode_ai_analysis.py repo_analyzer.py

      - name: Radon cyclomatic (non-failing signal)
        run: |
          radon cc app.py -a -nc || true

      - name: Pylint (informational)
        run: |
          pylint --exit-zero --score=n app.py sandbox.py refactor_engine.py energy_runner.py || true
